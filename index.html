<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Xplore">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0d0a1f">
<title>Xplore</title>
<link rel="apple-touch-icon" id="ati" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#efeaff; --ink:#14102b; --card:#ffffff; --dot:#c9bdf5;
  --mag:#e6007e; --cyan:#00a8d6; --yel:#ffcf00; --mute:#6b6590;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d0a1f; --ink:#f4f0ff; --card:#1a1438; --dot:#2a2160;
    --mag:#ff2d95; --cyan:#19e3ff; --yel:#ffe600; --mute:#9d94cc;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d0a1f; --ink:#f4f0ff; --card:#1a1438; --dot:#2a2160;
  --mag:#ff2d95; --cyan:#19e3ff; --yel:#ffe600; --mute:#9d94cc;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100vh;background-color:var(--bg);color:var(--ink);
  background-image:radial-gradient(var(--dot) 1.4px,transparent 1.8px);
  background-size:11px 11px;
  font:500 16px/1.35 "Rubik",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;
}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px 60px}
.wrap.shake{animation:shake .5s}
@keyframes shake{20%{transform:translate(-7px,3px)}40%{transform:translate(7px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-2px)}}
h1{position:relative;margin:0;font:400 44px/1 "Bungee",Impact,sans-serif;letter-spacing:1px}
h1::before,h1::after{content:attr(data-t);position:absolute;left:0;top:0;pointer-events:none;opacity:0}
h1::before{color:var(--cyan);animation:glitch 6s steps(1) infinite}
h1::after{color:var(--mag);animation:glitch 6s steps(1) infinite .08s}
@keyframes glitch{
  0%,92%,100%{opacity:0;transform:none}
  93%{opacity:1;transform:translate(-4px,1px)}
  95%{opacity:1;transform:translate(4px,-2px)}
  97%{opacity:1;transform:translate(-2px,2px)}
}
.stat{margin:16px 0 20px;display:flex;gap:12px;align-items:center}
.lvl{
  flex:none;width:64px;height:64px;display:grid;place-items:center;text-align:center;
  background:var(--yel);color:#14102b;border:3px solid var(--ink);border-radius:50%;
  box-shadow:4px 4px 0 var(--mag);font:400 11px/1 "Bungee",sans-serif;
}
.lvl b{display:block;font-size:26px;line-height:1}
.bar{flex:1}
.track{height:20px;border:3px solid var(--ink);background:var(--card);border-radius:12px;overflow:hidden;box-shadow:4px 4px 0 var(--cyan)}
.fill{height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--mag) 0 8px,var(--yel) 8px 16px);transition:width .6s cubic-bezier(.2,1.4,.4,1)}
.xp{margin-top:8px;font-size:13px;color:var(--mute)}
.add{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.add input{
  width:100%;padding:13px 14px;font:inherit;color:var(--ink);background:var(--card);
  border:3px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 var(--ink);
}
.add input:focus-visible,button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.diff{display:flex;gap:8px}
.diff button{flex:1;padding:10px 4px;font:700 14px "Rubik",sans-serif;color:var(--ink);background:var(--card);border:3px solid var(--ink);border-radius:10px}
.diff button[data-x="10"]{--c:var(--cyan)}
.diff button[data-x="25"]{--c:var(--yel)}
.diff button[data-x="50"]{--c:var(--mag)}
.diff button[aria-pressed="true"]{border-color:var(--c)}
.row{display:flex;gap:10px}
.go,.dice{flex:1;padding:13px;font:400 16px "Bungee",sans-serif;color:#14102b;border:3px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 var(--ink)}
.go{background:var(--mag);color:#fff}
.dice{background:var(--cyan)}
.go:active,.dice:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
ul{list-style:none;margin:22px 0 0;padding:0;display:flex;flex-direction:column;gap:14px}
li{position:relative}
li[data-x="10"]{--c:var(--cyan)} li[data-x="25"]{--c:var(--yel)} li[data-x="50"]{--c:var(--mag)}
.card{
  position:relative;display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);
  border:3px solid var(--ink);border-radius:12px;box-shadow:5px 5px 0 var(--c,var(--mag));
  touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
@keyframes in{from{transform:scale(.8) rotate(-2deg);opacity:0}}
.card.pop{animation:in .35s cubic-bezier(.2,1.5,.4,1)}
.undo{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:16px;
  background:var(--cyan);color:#14102b;border:3px solid var(--ink);border-radius:12px;font:400 13px "Bungee",sans-serif;
}
.chk{flex:none;width:36px;height:36px;border:3px solid var(--ink);border-radius:50%;background:transparent;color:#14102b;font:400 18px/1 "Bungee",sans-serif}
.done .chk{background:var(--yel)}
.t{flex:1;word-break:break-word}
.pts{font:400 13px "Bungee",sans-serif;color:var(--mute)}
.done .t{text-decoration:line-through;color:var(--mute)}
.done .card{box-shadow:none;animation:none}
.del{flex:none;background:none;border:0;color:var(--mute);font-size:22px;padding:4px 8px}
.sym{width:11px;height:18px;margin-left:7px;vertical-align:-2px;fill:var(--yel);stroke:#14102b;stroke-width:10;stroke-linejoin:round}
li.drag{z-index:5}
li.drag .card{transform:scale(1.03);box-shadow:8px 8px 0 var(--ink)}
.empty,.hint{margin:18px 0 0;text-align:center;color:var(--mute);font-size:14px}
.reset{display:block;margin:34px auto 0;padding:10px 16px;background:none;color:var(--mute);border:2px dashed var(--mute);border-radius:10px;font:700 13px "Rubik",sans-serif}
.reset.arm{background:var(--mag);color:#fff;border-color:var(--ink)}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.pow{
  position:absolute;left:50%;top:66%;translate:-50% -50%;padding:14px 26px;
  font:400 50px/1 "Bungee",Impact,sans-serif;color:#14102b;background:var(--yel);
  border:5px solid #14102b;box-shadow:8px 8px 0 var(--mag);white-space:nowrap;
  clip-path:polygon(0 10%,18% 0,32% 12%,50% 0,66% 12%,84% 0,100% 12%,92% 50%,100% 88%,82% 100%,64% 88%,48% 100%,30% 88%,14% 100%,0 86%,8% 50%);
  animation:pow 1.1s ease-out forwards;
}
.pow.big{font-size:40px;background:var(--cyan)}
@keyframes pow{0%{scale:.2;rotate:-20deg;opacity:0}20%{scale:1.2;rotate:-6deg;opacity:1}35%{scale:1}85%{opacity:1}100%{scale:1.1;opacity:0}}
.dot{position:absolute;width:14px;height:14px;border-radius:50%;animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.gain{position:absolute;left:50%;top:80%;translate:-50% 0;font:400 30px "Bungee",sans-serif;color:var(--yel);-webkit-text-stroke:2px #14102b;animation:up 1.3s ease-out forwards}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
.flash{position:absolute;inset:0;background:var(--yel);animation:fl .5s ease-out forwards}
.flash.w{background:#fff;animation-duration:.8s}
@keyframes fl{from{opacity:.55}to{opacity:0}}
.bolt{position:absolute;left:50%;top:10%;width:120px;height:192px;translate:-50% 0;animation:bolt 1.4s ease-out forwards}
.bolt>div{position:absolute;inset:0}
.bolt svg{width:100%;height:100%;overflow:visible}
.bolt .o{fill:none;stroke:var(--ink);stroke-width:4;stroke-linejoin:round}
.bolt .y{fill:#ffe600;stroke:#14102b;stroke-width:4;stroke-linejoin:round}
.bolt .f{clip-path:inset(100% 0 0 0);filter:drop-shadow(0 0 14px #ffe600);animation:fillup .6s cubic-bezier(.3,0,.2,1) .1s forwards}
@keyframes fillup{to{clip-path:inset(0 0 0 0)}}
@keyframes bolt{0%{scale:.5;opacity:0}15%{scale:1.1;opacity:1}25%{scale:1}85%{opacity:1}100%{opacity:0}}
.strike{position:absolute;top:0;bottom:0;left:12%;right:12%;animation:strike 1.2s linear forwards}
.strike svg{width:100%;height:100%;filter:drop-shadow(0 0 16px #19e3ff)}
@keyframes strike{
  0%{clip-path:inset(0 0 100% 0);opacity:1}14%{clip-path:inset(0 0 0 0);opacity:1}
  24%{opacity:.15}34%{opacity:1}46%{opacity:.25}56%{opacity:1}100%{opacity:0;clip-path:inset(0)}
}
@media (prefers-reduced-motion:reduce){
  h1::before,h1::after,.card,.card.pop,.wrap.shake{animation:none}
  .dot,.flash,.strike{display:none}
  .fill{transition:none}
}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <h1 data-t="XPLORE">XPLORE</h1>

  <div class="stat">
    <div class="lvl"><div>LVL<b id="lv">1</b></div></div>
    <div class="bar">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="xp" id="xp">0 / 100 XP</div>
    </div>
  </div>

  <div class="add">
    <input id="inp" type="text" placeholder="Nieuwe quest…" maxlength="80" enterkeyhint="done" autocomplete="off">
    <div class="diff" id="diff">
      <button type="button" data-x="10" aria-pressed="false">Snel +10</button>
      <button type="button" data-x="25" aria-pressed="true">Medium +25</button>
      <button type="button" data-x="50" aria-pressed="false">Epic +50</button>
    </div>
    <div class="row">
      <button class="go" id="add" type="button">Toevoegen</button>
      <button class="dice" id="dice" type="button">Verras mij</button>
    </div>
  </div>

  <ul id="list"></ul>
  <p class="empty" id="empty" hidden>Nog geen quests. Voeg er een toe of tik op Verras mij.</p>
  <p class="hint" id="hint" hidden>Per ongeluk afgevinkt? Swipe de quest naar links om het ongedaan te maken.</p>
  <button class="reset" id="reset" type="button">Alles resetten</button>
</div>
<div id="fx"></div>

<script>
var RANDOM=[
  ["Neem een lange, warme douche en geniet ervan",10],
  ["Schrijf drie dingen op waar je trots op bent",10],
  ["Drink nu meteen een groot glas water",10],
  ["Doe 20 minuten iets wat jij fijn vindt, zonder schuldgevoel",25],
  ["Zeg hardop iets liefs tegen jezelf in de spiegel",10],
  ["Ruim één lade op",10],
  ["Maak je bureau of tafel leeg en veeg ze af",10],
  ["Gooi vijf dingen weg die je niet meer nodig hebt",25],
  ["Doe de afwas en laat je gootsteen blinken",10],
  ["Sorteer je kleerkast en maak een zak om weg te geven",50],
  ["Eet vandaag één stuk fruit extra",10],
  ["Maak een maaltijd met minstens drie soorten groenten",25],
  ["Probeer een groente die je zelden eet",25],
  ["Bereid je lunch van morgen vandaag al voor",25],
  ["Vervang één frisdrank of snack door iets gezonds",10],
  ["Wandel 15 minuten buiten, zonder je gsm in je hand",10],
  ["Neem een andere route naar huis of naar de winkel",10],
  ["Wandel naar een plek in je buurt waar je nog nooit was",50],
  ["Bel een vriend of vriendin gewoon om te babbelen",25],
  ["Stuur iemand een compliment dat je echt meent",10],
  ["Plan een afspraak met iemand die je lang niet gezien hebt",25],
  ["Lees 10 pagina’s van een boek",10],
  ["Lees een lang artikel over iets waar je nieuwsgierig naar bent",25],
  ["Teken iets in 5 minuten, het mag lelijk zijn",10],
  ["Schrijf een kort verhaaltje van 5 zinnen",25],
  ["Maak een playlist voor een bepaald gevoel",25],
  ["Maak een foto van iets moois en zoek de beste hoek",10],
  ["Doe 20 squats of push-ups",10],
  ["Doe 10 minuten stretchen of yoga",10],
  ["Ga minstens 30 minuten sporten of bewegen",50]
];
var WORDS=["POW!","ZAP!","BAM!","YES!","BOOM!","NICE!"];
var COLORS=["#ff2d95","#19e3ff","#ffe600","#ffffff"];
var BP="62,0 18,88 46,88 34,160 86,66 56,66 78,0";
var SYM='<svg class="sym" viewBox="0 0 100 160" aria-label="Verrassingsquest"><polygon points="'+BP+'"/></svg>';
var SP="55,0 30,90 52,95 20,190 48,196 15,300 85,160 58,154 90,70 62,64 82,0";
var S={xp:0,quests:[]};
var pick=25,fxTimer=null,resetTimer=null,newId=null;

try{var raw=localStorage.getItem("xplore")||localStorage.getItem("questlog");if(raw){S=JSON.parse(raw)}}catch(e){}
function save(){try{localStorage.setItem("xplore",JSON.stringify(S))}catch(e){}}

var $=function(id){return document.getElementById(id)};
var list=$("list"),fx=$("fx");

function lvl(){return Math.floor(S.xp/100)+1}
function render(){
  list.innerHTML="";
  var sorted=S.quests.slice().sort(function(a,b){return a.done-b.done});
  sorted.forEach(function(q){
    var li=document.createElement("li");
    li.dataset.x=q.xp;li.dataset.id=String(q.id);
    if(q.done){li.className="done";var u=document.createElement("div");u.className="undo";u.textContent="↩ Ongedaan";li.appendChild(u)}
    var card=document.createElement("div");card.className="card"+(q.id===newId?" pop":"");
    var b=document.createElement("button");
    b.className="chk";b.type="button";b.setAttribute("aria-label","Quest afronden");
    b.textContent=q.done?"✓":"";
    b.onclick=function(){complete(q.id)};
    var t=document.createElement("span");t.className="t";t.textContent=q.t;
    var p=document.createElement("span");p.className="pts";p.textContent="+"+q.xp;if(q.r)p.insertAdjacentHTML("beforeend",SYM);
    var d=document.createElement("button");
    d.className="del";d.type="button";d.setAttribute("aria-label","Verwijderen");d.textContent="×";
    d.onclick=function(){S.quests=S.quests.filter(function(x){return x.id!==q.id});save();render()};
    card.append(b,t,p,d);li.appendChild(card);
    if(q.done)swipe(card,q);else reorder(card,li);
    list.appendChild(li);
  });
  newId=null;
  $("empty").hidden=S.quests.length>0;
  $("hint").hidden=!S.quests.some(function(q){return q.done});
  $("lv").textContent=lvl();
  $("fill").style.width=(S.xp%100)+"%";
  $("xp").textContent=(S.xp%100)+" / 100 XP  ·  totaal "+S.xp;
}
function addQuest(t,xp,r){
  t=t.trim();if(!t)return;
  newId=Date.now()+Math.random();
  S.quests.unshift({id:newId,t:t,xp:xp,done:false,r:!!r});
  save();render();
}

function swipe(card,q){
  var sx=0,sy=0,dx=0,on=false,drag=false,pid=0;
  card.addEventListener("pointerdown",function(e){sx=e.clientX;sy=e.clientY;dx=0;on=true;drag=false;pid=e.pointerId});
  card.addEventListener("pointermove",function(e){
    if(!on)return;
    var mx=e.clientX-sx,my=e.clientY-sy;
    if(!drag){
      if(Math.abs(mx)>10&&Math.abs(mx)>Math.abs(my)){drag=true;try{card.setPointerCapture(pid)}catch(_){}}
      else return;
    }
    dx=Math.min(0,mx);card.style.transition="none";card.style.transform="translateX("+dx+"px)";
  });
  function end(){
    if(!on)return;on=false;
    card.style.transition="transform .25s";
    if(drag&&dx<-90){card.style.transform="translateX(-110%)";setTimeout(function(){undo(q.id)},200)}
    else{card.style.transform=""}
  }
  card.addEventListener("pointerup",end);
  card.addEventListener("pointercancel",end);
}
function reorder(card,li){
  var timer=null,active=false,startY=0,lastY=0,sx=0,startTop=0,startScroll=0;
  function begin(){
    active=true;startY=lastY;startTop=li.offsetTop;startScroll=window.scrollY;
    li.classList.add("drag");
    try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
  }
  function move(y){
    lastY=y;
    if(y<90)window.scrollBy(0,-14);else if(y>window.innerHeight-90)window.scrollBy(0,14);
    var want=startTop+(y-startY)+(window.scrollY-startScroll);
    var mid=want+li.offsetHeight/2;
    var prev=li.previousElementSibling,next=li.nextElementSibling;
    while(prev&&!prev.classList.contains("done")&&mid<prev.offsetTop+prev.offsetHeight/2){
      list.insertBefore(prev,li.nextSibling);prev=li.previousElementSibling;
    }
    while(next&&!next.classList.contains("done")&&mid>next.offsetTop+next.offsetHeight/2){
      list.insertBefore(next,li);next=li.nextElementSibling;
    }
    li.style.transform="translateY("+(want-li.offsetTop)+"px)";
  }
  function finish(){
    if(!active)return;active=false;
    li.classList.remove("drag");li.style.transform="";
    var order=[].slice.call(list.children).filter(function(x){return !x.classList.contains("done")}).map(function(x){return x.dataset.id});
    var open=S.quests.filter(function(q){return !q.done}),closed=S.quests.filter(function(q){return q.done});
    open.sort(function(a,b){return order.indexOf(String(a.id))-order.indexOf(String(b.id))});
    S.quests=open.concat(closed);save();render();
  }
  card.addEventListener("touchstart",function(e){
    if(e.target.closest("button"))return;
    var t=e.touches[0];lastY=startY=t.clientY;sx=t.clientX;
    clearTimeout(timer);timer=setTimeout(begin,350);
  },{passive:true});
  card.addEventListener("touchmove",function(e){
    var t=e.touches[0];
    if(active){e.preventDefault();move(t.clientY);return}
    lastY=t.clientY;
    if(Math.abs(t.clientY-startY)>8||Math.abs(t.clientX-sx)>8)clearTimeout(timer);
  },{passive:false});
  function stop(){clearTimeout(timer);finish()}
  card.addEventListener("touchend",stop);
  card.addEventListener("touchcancel",stop);
  card.addEventListener("mousedown",function(e){
    if(e.button!==0||e.target.closest("button"))return;
    startY=lastY=e.clientY;
    function mm(ev){
      if(!active){if(Math.abs(ev.clientY-startY)>5){lastY=ev.clientY;begin()}else return}
      move(ev.clientY);
    }
    function mu(){window.removeEventListener("mousemove",mm);window.removeEventListener("mouseup",mu);finish()}
    window.addEventListener("mousemove",mm);window.addEventListener("mouseup",mu);
  });
}
function undo(id){
  var q=S.quests.find(function(x){return x.id===id});
  if(!q||!q.done)return;
  q.done=false;S.xp=Math.max(0,S.xp-(q.gain||q.xp));q.gain=0;
  save();render();
  try{navigator.vibrate&&navigator.vibrate(20)}catch(e){}
}

function el(cls,txt){
  var e=document.createElement("div");e.className=cls;if(txt)e.textContent=txt;
  fx.appendChild(e);return e;
}
function boltHTML(){
  var s=function(c){return '<svg viewBox="0 0 100 160"><polygon class="'+c+'" points="'+BP+'"/></svg>'};
  return '<div class="bolt"><div>'+s("o")+'</div><div class="f">'+s("y")+'</div></div>';
}
function strikeHTML(){
  return '<div class="strike"><svg viewBox="0 0 100 300" preserveAspectRatio="none">'+
    '<polygon points="'+SP+'" fill="#ff2d95" transform="translate(-5 0)"/>'+
    '<polygon points="'+SP+'" fill="#19e3ff" transform="translate(5 0)"/>'+
    '<polygon points="'+SP+'" fill="#ffffff" stroke="#ffe600" stroke-width="2"/></svg></div>';
}
function burst(word,big){
  var p=el("pow"+(big?" big":""),word);
  p.style.rotate=(Math.random()*10-5)+"deg";
  for(var i=0;i<18;i++){
    var d=el("dot"),a=Math.random()*6.28,r=100+Math.random()*140;
    d.style.left="50%";d.style.top="55%";d.style.background=COLORS[i%4];
    d.style.setProperty("--dx",Math.cos(a)*r+"px");
    d.style.setProperty("--dy",Math.sin(a)*r+"px");
  }
}
function complete(id){
  var q=S.quests.find(function(x){return x.id===id});
  if(!q||q.done)return;
  var before=lvl(),jackpot=Math.random()<0.2;
  var gain=jackpot?q.xp*2:q.xp;
  q.done=true;q.gain=gain;S.xp+=gain;save();
  try{navigator.vibrate&&navigator.vibrate(jackpot?[40,40,80]:30)}catch(e){}
  clearTimeout(fxTimer);fx.innerHTML="";
  var up=lvl()>before;
  if(up){
    el("flash w");fx.insertAdjacentHTML("beforeend",strikeHTML());
    var w=$("wrap");w.classList.remove("shake");void w.offsetWidth;w.classList.add("shake");
    burst("LEVEL "+lvl()+"!",true);
    try{navigator.vibrate&&navigator.vibrate([60,40,120])}catch(e){}
  }else{
    el("flash");fx.insertAdjacentHTML("beforeend",boltHTML());
    if(jackpot)burst("JACKPOT!",true);else burst(WORDS[Math.floor(Math.random()*WORDS.length)]);
  }
  el("gain","+"+gain+" XP"+(jackpot?" (x2)":""));
  fxTimer=setTimeout(function(){fx.innerHTML=""},2000);
  render();
}

document.querySelectorAll("#diff button").forEach(function(b){
  b.onclick=function(){
    pick=+b.dataset.x;
    document.querySelectorAll("#diff button").forEach(function(o){o.setAttribute("aria-pressed",o===b?"true":"false")});
  };
});
$("add").onclick=function(){addQuest($("inp").value,pick);$("inp").value=""};
$("inp").onkeydown=function(e){if(e.key==="Enter"){$("add").click()}};
$("dice").onclick=function(){
  var have=S.quests.map(function(q){return q.t});
  var pool=RANDOM.filter(function(r){return have.indexOf(r[0])<0});
  if(!pool.length)pool=RANDOM;
  var r=pool[Math.floor(Math.random()*pool.length)];
  addQuest(r[0],r[1],true);
};
$("reset").onclick=function(){
  var b=$("reset");
  if(b.classList.contains("arm")){
    clearTimeout(resetTimer);b.classList.remove("arm");b.textContent="Alles resetten";
    S={xp:0,quests:[]};save();render();
  }else{
    b.classList.add("arm");b.textContent="Zeker? Tik nogmaals";
    resetTimer=setTimeout(function(){b.classList.remove("arm");b.textContent="Alles resetten"},3000);
  }
};

function makeIcon(){
  try{
    var c=document.createElement("canvas");c.width=c.height=180;var g=c.getContext("2d");
    g.fillStyle="#0d0a1f";g.fillRect(0,0,180,180);
    var pts=BP.split(" ").map(function(p){var a=p.split(",");return [+a[0],+a[1]]});
    function path(ox,oy){g.beginPath();pts.forEach(function(p,i){var x=ox+p[0]*0.8+30,y=oy+p[1]*0.8+26;i?g.lineTo(x,y):g.moveTo(x,y)});g.closePath()}
    g.fillStyle="#ff2d95";path(-6,4);g.fill();
    g.fillStyle="#19e3ff";path(6,-2);g.fill();
    g.fillStyle="#ffe600";path(0,0);g.fill();
    $("ati").href=c.toDataURL("image/png");
  }catch(e){}
}
makeIcon();
render();
</script>
</body>
</html>
